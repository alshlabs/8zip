[package]
name = "eight-zip"
version = "0.0.0-local"
edition = "2024"

[[bin]]
name = "8zip"
path = "src/main.rs"

[lints.rust]
elided_lifetimes_in_paths = "allow"
rust_2018_idioms = { priority = -1, level = "deny" }

[lints.clippy]
module_inception = "allow"
uninlined_format_args = "allow"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1.11", features = ["rust_backend"] }
glob = "0.3.4"
gzp = { version = "2.0.4", features = ["flate2"] }
normalize-path = "0.2.2"
num_cpus = "1.17.0"
self_update = { version = "1.3.3", default-features = false, features = [
  "github",
  "reqwest",
  "rustls",
  "archive-tar",
  "compression-tar-gz",
  "checksums",
] }
semver = "1.0.28"
tar = "0.4.46"
walkdir = "2.5.0"
xz2 = "0.1.7"
zip = "9.4.1"

[profile.release]
opt-level = 3
debug = false
lto = true
strip = "debuginfo"
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false
